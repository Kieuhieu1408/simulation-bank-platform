name: simulation-bank

services:
  # ── Infrastructure (Backing Services) ────────────────────────
  
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: sim-bank-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
    ports:
      - "8090:8080"       # host:8090 → keycloak container:8080
    volumes:
      - ./config/keycloak:/opt/keycloak/data/import   # realm export để auto-import
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - sim-bank-net

  vault:
    image: hashicorp/vault:1.17
    container_name: sim-bank-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    networks:
      - sim-bank-net

  redis:
    image: redis:7-alpine
    container_name: sim-bank-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - sim-bank-net

  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: sim-bank-oracle
    environment:
      ORACLE_PASSWORD: oracle_demo
      APP_USER: corebank
      APP_USER_PASSWORD: corebank_demo
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - sim-bank-net

  postgres:
    image: postgres:15-alpine
    container_name: sim-bank-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: common_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d common_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sim-bank-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: sim-bank-kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - sim-bank-net

  # ── Observability ───────────────────────────────────────────

  loki:
    image: grafana/loki:latest
    container_name: sim-bank-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - sim-bank-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: sim-bank-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - jaeger
      - loki
    networks:
      - sim-bank-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: sim-bank-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # UI
    networks:
      - sim-bank-net

  prometheus:
    image: prom/prometheus:latest
    container_name: sim-bank-prometheus
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - sim-bank-net

  grafana:
    image: grafana/grafana:latest
    container_name: sim-bank-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - sim-bank-net

  # ── Application Services ────────────────────────────────────

  corebank:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: corebank/Dockerfile
    container_name: sim-bank-corebank
    image: harbor.sim-bank.local/sim-bank/corebank:latest
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8180/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    environment:
      DB_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      DB_USERNAME: corebank
      DB_PASSWORD: corebank_demo
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/simulation-bank
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_LOGS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
    ports:
      - "8180:8180"       # host:8180 → corebank container:8180
    depends_on:
      oracle:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sim-bank-net

  money-bank:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: money-bank/Dockerfile
    container_name: sim-bank-money-bank
    image: harbor.sim-bank.local/sim-bank/money-bank:latest
    environment:
      DB_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      DB_USERNAME: corebank
      DB_PASSWORD: corebank_demo
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/simulation-bank
      COREBANK_URL: http://corebank:8180
      OAUTH2_CLIENT_ID: moneybank-service
      OAUTH2_CLIENT_SECRET: moneybank-secret
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_LOGS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
    ports:
      - "8181:8181"       # host:8181 → money-bank container:8181
    depends_on:
      oracle:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      corebank:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sim-bank-net

  api-gateway:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: sim-bank-api-gateway
    image: harbor.sim-bank.local/sim-bank/api-gateway:latest
    environment:
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/simulation-bank
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONEY_BANK_URL: http://money-bank:8181
      CMS_BACKEND_URL: http://cms:8182
      PROFILE_SERVICE_URL: http://profile-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_LOGS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
    depends_on:
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sim-bank-net

  nginx:
    profiles: ["apps"]
    image: nginx:1.27-alpine
    container_name: sim-bank-nginx
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    networks:
      - sim-bank-net

volumes:
  oracle-data:
  postgres-data:

networks:
  sim-bank-net:
    driver: bridge
