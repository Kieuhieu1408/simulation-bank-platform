events { worker_connections 1024; }

http {
  upstream api_gateway {
    server api-gateway:8080;
    # Thêm replica khi scale: server api-gateway-2:8080;
    keepalive 32;
  }

  # Rate limiting zone
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

  server {
    listen 80;
    server_name localhost;

    # Access log format với timing
    log_format main '$remote_addr - $request - $status - ${request_time}s';
    access_log /var/log/nginx/access.log main;

    # Health check endpoint cho Nginx itself
    location /nginx-health {
      return 200 "healthy\n";
      add_header Content-Type text/plain;
    }

    # Proxy tất cả traffic về API Gateway
    location / {
      limit_req zone=api_limit burst=20 nodelay;
      
      proxy_pass http://api_gateway;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Timeout
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }
  }
}
