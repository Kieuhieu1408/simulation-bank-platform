groups:
  - name: sim-bank-red-metrics
    interval: 1m
    rules:
      # Error Rate > 5% trong 5 phút
      - alert: HighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (application)
          / sum(rate(http_server_requests_seconds_count[5m])) by (application) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "High error rate on {{ $labels.application }}"

      # P99 latency > 2s
      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99,
            rate(http_server_requests_seconds_bucket[5m])
          ) > 2
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "P99 latency > 2s on {{ $labels.application }}"

      # Service down (no metrics)
      - alert: ServiceDown
        expr: up{job=~"corebank|money-bank|api-gateway"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Service {{ $labels.job }} is DOWN"

      # JVM Memory > 80%
      - alert: JvmMemoryHigh
        expr: |
          jvm_memory_used_bytes{area="heap"}
          / jvm_memory_max_bytes{area="heap"} > 0.8
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "JVM heap > 80% on {{ $labels.application }}"

      # Circuit Breaker OPEN
      - alert: CircuitBreakerOpen
        expr: resilience4j_circuitbreaker_state{state="open"} == 1
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Circuit breaker OPEN: {{ $labels.name }}"
