receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

  transform/redact_pii:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - 'replace_pattern(body, "(?i)(cccd|id|idcard)[\\s:=]*(\\d{4})\\d{4}(\\d{4})", "$$1: $$2****$$3")'
          - 'replace_pattern(body, "(?i)(phone|sdt|tel)[\\s:=]*(0\\d{2})\\d{4}(\\d{3})", "$$1: $$2****$$3")'
          - 'replace_all_matches(body, "\\b\\d{12}\\b", "************")'
          - 'replace_all_matches(body, "\\b0\\d{9}\\b", "0xx-xxx-xxxx")'

exporters:
  debug:
    verbosity: detailed

  otlp/jaeger:
    endpoint: "jaeger:4317"
    tls:
      insecure: true

  otlphttp/loki:
    endpoint: "http://loki:3100/otlp"
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
    logs:
      receivers: [otlp]
      processors: [transform/redact_pii, batch]
      exporters: [debug, otlphttp/loki]
