spring:
  datasource:
    url: jdbc:h2:mem:corebank;MODE=Oracle;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  main:
    banner-mode: off

money-bank:
  security:
    audience: test-audience
    issuer: test-issuer
    jwkSetUri: http://localhost:8080/certs

corebank:
  transfer:
    sync-timeout-seconds: 3
    stuck-threshold-seconds: 30
    recovery-interval-ms: 60000
