services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: corebank-oracle
    environment:
      ORACLE_PASSWORD: oracle_demo
      APP_USER: corebank
      APP_USER_PASSWORD: corebank_demo
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: corebank-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  corebank:
    build:
      context: ..
      dockerfile: corebank/Dockerfile
    container_name: corebank-api
    environment:
      DB_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      DB_USERNAME: corebank
      DB_PASSWORD: corebank_demo
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "${APP_PORT:-8180}:8180"
    depends_on:
      oracle:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  oracle-data:
