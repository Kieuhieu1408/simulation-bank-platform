apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: corebank-query-hpa
  namespace: sim-bank
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: corebank-query
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
