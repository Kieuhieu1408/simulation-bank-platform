spring:
  application:
    name: moneybank
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:corebank}
    password: ${DB_PASSWORD:corebank_demo}
    driver-class-name: oracle.jdbc.OracleDriver
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true          # NEVER drop schema in non-local env
    clean-on-validation-error: false
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/simulation-bank}
      # Client Credentials — dùng để gọi internal service (corebank, profile-service)
      client:
        registration:
          moneybank-internal:
            client-id: ${OAUTH2_CLIENT_ID:moneybank-service}
            client-secret: ${OAUTH2_CLIENT_SECRET:moneybank-secret}
            authorization-grant-type: client_credentials
            scope: corebank:read, corebank:write
        provider:
          moneybank-internal:
            token-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/simulation-bank}/protocol/openid-connect/token
  jackson:
    time-zone: UTC

server:
  port: 8181

# Internal service endpoints
corebank:
  url: ${COREBANK_URL:http://localhost:8180}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: moneybank
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    root: INFO
    com.hieu.moneybank: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} traceId=%X{traceId} spanId=%X{spanId} - %msg%n"


money-bank:
  security:
    jwk-set-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/simulation-bank}/protocol/openid-connect/certs
    issuer: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/simulation-bank}
    audience: moneybank-service

  # ── Outbox Dispatcher (U-07) ────────────────────────────────────────────────
  # dispatcher-enabled: false   ← mặc định TẮT; chỉ bật khi Kafka sẵn sàng.
  # Bật mà thiếu spring.kafka.bootstrap-servers → ứng dụng fail khi khởi động.
  # Đó là hành vi mong muốn: không publish silently.
  outbox:
    dispatcher-enabled: ${OUTBOX_DISPATCHER_ENABLED:false}
    batch-size: 50
    poll-interval: 1s
    retry-backoff: 2s
    max-retry-backoff: 5m
    alert-after-attempts: 10

  # ── Kafka Outbox Topics (U-07) ───────────────────────────────────────────────
  kafka:
    transfer-events-topic: ${KAFKA_TOPIC_TRANSFER_EVENTS:transfer-events}
    request-timeout-ms: 5000
    retries: 3

# ── Spring Kafka Producer ────────────────────────────────────────────────────
# bootstrap-servers để trống theo mặc định → Kafka client KHÔNG được khởi tạo.
# Set qua env var KAFKA_BOOTSTRAP_SERVERS khi deploy với Kafka.
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    producer:
      # Acks và idempotence được override trong OutboxKafkaConfig.
      # Khai báo ở đây để Spring Boot auto-config cũng nhận (nếu có auto-config khác).
      acks: all
      enable-idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    # Consumer chưa được dùng ở money-bank (U-08 sẽ thêm sau)
    # consumer:
    #   group-id: money-bank-inbox
    #   auto-offset-reset: earliest
