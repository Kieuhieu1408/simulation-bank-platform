spring:
  application:
    name: cms
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cms}
    username: ${DB_USER:cms}
    password: ${DB_PASSWORD:cms}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8182

common:
  security:
    jwk-set-uri: http://localhost:8080/realms/simulation-bank/protocol/openid-connect/certs
    issuer: http://localhost:8080/realms/simulation-bank
    audience: account
    scope-claim: scope

money-bank:
  security:
    jwk-set-uri: http://localhost:8080/realms/simulation-bank/protocol/openid-connect/certs
    issuer: http://localhost:8080/realms/simulation-bank
    audience: account
    scope-claim: scope
